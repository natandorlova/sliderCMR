<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заполнение CMR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="intro">

        <h2>Заполнение CMR</h2>

        <p>
            Передвиньте ползунок сверху вниз
        </p>

    </div>


    <div class="main-layout">


        <!-- ДОКУМЕНТ + ПОЛЗУНОК -->

        <div class="document-wrapper">


            <!-- ДОКУМЕНТ -->

            <div class="document" id="document">

                <img
                    src="images/cmr.png"
                    class="invoice-image"
                    id="cmrImage"
                    alt="CMR"
                    draggable="false"
                >

                <div id="markers"></div>

            </div>


            <!-- ВЕРТИКАЛЬНЫЙ ПОЛЗУНОК -->

            <div
                class="slider-track"
                id="sliderTrack"
            >

                <div
                    class="slider-handle"
                    id="sliderHandle"
                >

                    <div class="handle-circle">
                        ▼
                    </div>

                </div>

            </div>


        </div>


        <!-- ПРАВАЯ ПАНЕЛЬ -->

        <aside class="side-panel">


            <!-- ИНСТРУКЦИЯ, ВИДНА ПО УМОЛЧАНИЮ -->

            <div
                class="instruction"
                id="instruction"
            >

                <strong>Подсказка</strong>

                Кликните на цветное поле,
                чтобы увидеть пояснение.

            </div>


            <!-- ЗДЕСЬ ПОЯВЛЯЕТСЯ КАРТОЧКА -->

            <div
                class="info-panel"
                id="infoPanel"
            >

                <div
                    class="info-card"
                    id="infoCard"
                >

                    <button
                        class="close-button"
                        id="closeButton"
                        type="button"
                        aria-label="Закрыть"
                    >
                        ×
                    </button>

                    <div
                        class="info-number"
                        id="cardNumber"
                    ></div>

                    <h3 id="cardTitle"></h3>

                    <div id="cardContent"></div>

                </div>

            </div>


        </aside>


    </div>

</div>


<script src="data.js"></script>
<script src="script.js"></script>

</body>

</html>
